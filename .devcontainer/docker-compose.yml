volumes:
  # Persists ~/.cabal (package indices + built dependencies) across container
  # rebuilds, so `cabal build all` stays fast after the first run.
  cabal-store:

services:
  plinth:
    build: .
    volumes:
      - ..:/workspace
      - cabal-store:/root/.cabal

    # Overrides default command so things don't shut down after the process ends.
    command: /bin/sh -c "while sleep 1000; do :; done"

    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"
